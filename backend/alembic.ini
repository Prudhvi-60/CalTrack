[alembic]
script_location = alembic
prepend_sys_path = .
# Unused placeholder. alembic/env.py always overwrites this from DATABASE_URL.
# Do not point this at localhost; a missing env var must fail instead of migrating locally.
sqlalchemy.url = postgresql+psycopg://unused:unused@invalid.invalid:5432/unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
