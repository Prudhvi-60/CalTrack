# Railway deploys this service with Root Directory = backend/
# https://docs.railway.com/guides/config-as-code
# Secrets stay in the Railway dashboard, not in this file.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
preDeployCommand = "alembic upgrade head"
# Process health (also available at /api/v1/health). Use /health/ready for Postgres.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
