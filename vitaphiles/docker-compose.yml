services:
  postgres:
    image: postgres:16-alpine
    container_name: vitaphiles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitaphiles
      POSTGRES_PASSWORD: vitaphiles
      POSTGRES_DB: vitaphiles
    ports:
      - "5433:5432"
    volumes:
      - vitaphiles_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaphiles -d vitaphiles"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitaphiles_pg_data:
