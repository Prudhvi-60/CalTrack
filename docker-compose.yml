services:
  postgres:
    image: postgres:16-alpine
    container_name: caltrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caltrack
      POSTGRES_PASSWORD: caltrack
      POSTGRES_DB: caltrack
    ports:
      - "5432:5432"
    volumes:
      - caltrack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caltrack -d caltrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caltrack-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://caltrack:caltrack@postgres:5432/caltrack
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caltrack-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  caltrack_pg_data:
