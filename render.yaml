services:
  - type: web
    name: caltrack-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: Gemini
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_HUGGINGFACE
        value: "false"
      - key: SMOLAGENTS_ENABLED
        value: "false"
      - key: GRADIO_ENABLED
        value: "false"
